<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>วงล้อสุ่มรายชื่อ - Realtime</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { background: #222; border-radius: 50%; box-shadow: 0 0 15px rgba(255,255,255,0.2); margin-bottom: 20px; }
        .btn-spin { padding: 15px 40px; font-size: 20px; background-color: #ff4757; color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4); }
        .btn-spin:hover { background-color: #ff6b81; }
        #result { margin-top: 15px; font-size: 24px; color: #2ed573; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>วงล้อสุ่มผู้เล่น (Realtime)</h1>
        <canvas id="wheel" width="400" height="400"></canvas>
        <button class="btn-spin" onclick="spinWheel()">หมุนวงล้อ!</button>
        <div id="result"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVqPo6YRccJ_nP20sCwOQUE6sTMbIWYkk",
            authDomain: "spin12-f1c8b.firebaseapp.com",
            databaseURL: "https://spin12-f1c8b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "spin12-f1c8b",
            storageBucket: "spin12-f1c8b.firebasestorage.app",
            messagingSenderId: "324607174926",
            appId: "1:324607174926:web:7458375db29f3ea2c68f5f",
            measurementId: "G-8EGS10CTSP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let players = [];
        let startAngle = 0;
        let arc = 0;
        let spinAngle = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let ctx;

        const colors = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6", "#e67e22", "#1abc9c", "#34495e"];

        // ดึงข้อมูลรายชื่อจาก Firebase Realtime Database
        const playersRef = ref(db, 'players');
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                players = Object.values(data).map(p => p.name);
            } else {
                players = ["ยังไม่มีผู้เล่น"];
            }
            arc = Math.PI / (players.length / 2);
            drawWheel();
        });

        function byte2Hex(n) {
            let nybHexString = "0123456789ABCDEF";
            return String(nybHexString.substr((n >> 4) & 0x0F,1)) + nybHexString.substr(n & 0x0F,1);
        }

        function randomColor() {
            let red = Math.floor(Math.random() * 200) + 55;
            let green = Math.floor(Math.random() * 200) + 55;
            let blue = Math.floor(Math.random() * 200) + 55;
            return 'rgb(' + red + ',' + green + ',' + blue + ')';
        }

        function drawWheel() {
            let canvas = document.getElementById("wheel");
            if (canvas.getContext) {
                let outsideRadius = 180;
                let textRadius = 120;
                let insideRadius = 0;

                ctx = canvas.getContext("2d");
                ctx.clearRect(0,0,400,400);

                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;

                ctx.font = 'bold 16px sans-serif';

                for(let i = 0; i < players.length; i++) {
                    let angle = startAngle + i * arc;
                    ctx.fillStyle = colors[i % colors.length];

                    ctx.beginPath();
                    ctx.arc(200, 200, outsideRadius, angle, angle + arc, false);
                    ctx.arc(200, 200, insideRadius, angle + arc, angle, true);
                    ctx.stroke();
                    ctx.fill();

                    ctx.save();
                    ctx.shadowOffsetX = -1;
                    ctx.shadowOffsetY = -1;
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = "rgb(0,0,0)";
                    ctx.fillStyle = "white";
                    ctx.translate(200 + Math.cos(angle + arc / 2) * textRadius, 
                                  200 + Math.sin(angle + arc / 2) * textRadius);
                    ctx.rotate(angle + arc / 2 + Math.PI / 2);
                    let text = players[i];
                    ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                    ctx.restore();
                }

                // เข็มชี้ด้านบน
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.moveTo(200 - 10, 10);
                ctx.lineTo(200 + 10, 10);
                ctx.lineTo(200, 35);
                ctx.fill();
            }
        }

        window.spinWheel = function() {
            if (players.length === 0 || players[0] === "ยังไม่มีผู้เล่น") {
                alert("ยังไม่มีรายชื่อผู้เล่นในระบบ กรุณากรอกชื่อก่อนครับ!");
                return;
            }
            spinAngle = Math.random() * 1000 + 2000;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000;
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if(spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinFactor = easeOut(spinTime, 0, spinAngle, spinTimeTotal);
            startAngle += (spinFactor * Math.PI / 180);
            drawWheel();
            setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            let degrees = startAngle * 180 / Math.PI + 90;
            let arcd = arc * 180 / Math.PI;
            let index = Math.floor((360 - degrees % 360) / arcd);
            ctx.save();
            ctx.font = 'bold 30px sans-serif';
            let text = players[index % players.length];
            document.getElementById("result").innerHTML = "ผู้โชคดีคือ: " + text + " 🎉";
            ctx.restore();
        }

        function easeOut(t, b, c, d) {
            let ts = (t/=d)*t;
            let tc = ts*t;
            return b+c*(tc + -3*ts + 3*t);
        }
    </script>
</body>
</html>
